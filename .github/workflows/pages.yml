# Publica o Localquest no GitHub Pages (https) — necessário para a câmera (QR) e para instalar o app no celular.
# Uso: faça merge da branch na "main" e, em Settings → Pages, escolha "Source: GitHub Actions".
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove arquivos que não precisam ir ao site
        run: rm -rf tests .github iniciar.bat iniciar.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
